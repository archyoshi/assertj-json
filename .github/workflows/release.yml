name: Release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version (e.g. 0.1.0)'
        required: true
        type: string
      next_version:
        description: 'Next development snapshot version (e.g. 0.2.0-SNAPSHOT)'
        required: true
        type: string
      release_branch:
        description: 'Branch to release from'
        required: false
        default: 'main'
        type: string
      develop_branch:
        description: 'Development branch to update snapshot version'
        required: false
        default: 'develop'
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config pull.rebase false

      - name: Prepare Release Version
        run: |
          git fetch origin ${{ inputs.release_branch }}
          git checkout -B ${{ inputs.release_branch }} origin/${{ inputs.release_branch }}
          ./mvnw -B versions:set -DnewVersion=${{ inputs.release_version }} -DgenerateBackupPoms=false
          ./mvnw -B git-changelog:git-changelog -Dgit-changelog.toRef=HEAD || true
          ./mvnw -B clean verify

      - name: Commit and Tag Release
        run: |
          git add pom.xml
          if [ -f CHANGELOG.md ]; then git add CHANGELOG.md; fi
          if ! git diff --staged --quiet; then
            git commit -m "chore(release): release version ${{ inputs.release_version }}"
            git push origin ${{ inputs.release_branch }}
          fi
          git tag -a "v${{ inputs.release_version }}" -m "Release v${{ inputs.release_version }}"
          git push origin "v${{ inputs.release_version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ inputs.release_version }}"
          name: "v${{ inputs.release_version }}"
          generate_release_notes: true
          files: |
            target/*.jar

      - name: Bump Next Snapshot on Develop Branch
        run: |
          git fetch origin ${{ inputs.develop_branch }}
          git checkout -B ${{ inputs.develop_branch }} origin/${{ inputs.develop_branch }}
          git merge origin/${{ inputs.release_branch }} -m "chore: merge ${{ inputs.release_branch }} into ${{ inputs.develop_branch }} [skip ci]" --strategy-option=theirs || true
          ./mvnw -B versions:set -DnewVersion=${{ inputs.next_version }} -DgenerateBackupPoms=false
          ./mvnw -B clean compile
          git add pom.xml
          if ! git diff --staged --quiet; then
            git commit -m "chore: prepare next development iteration ${{ inputs.next_version }}"
            git push origin ${{ inputs.develop_branch }}
          fi
